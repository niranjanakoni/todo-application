name: "Agent task"
description: "Well-scoped work item suitable for an AI coding agent or a developer."
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to describe a change that can be implemented end-to-end: code + tests + docs.

  - type: input
    id: goal
    attributes:
      label: Goal
      description: "One sentence describing the desired outcome."
      placeholder: "Example: Add an endpoint to toggle task completion"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Why is this needed? Link related issues/PRs."
      placeholder: "Problem statement, user story, constraints"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Concrete, testable bullets."
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Backend (Spring Boot)
        - Frontend (React)
        - Both
        - CI/CD
        - Docs
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands to validate
      description: "Keep this aligned with CI."
      value: |
        Backend:
        - cd todo-backend && mvn -B -ntp clean verify

        Frontend:
        - cd todo-frontend && npm ci --legacy-peer-deps
        - cd todo-frontend && CI=true npm test -- --watchAll=false --passWithNoTests
        - cd todo-frontend && npm run build
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / risks
      description: "Security, data migration, API changes, rollout notes."
      placeholder: "Example: If API response changes, update taskService.js in the same PR"
    validations:
      required: false
