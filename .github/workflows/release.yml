name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g., v1.0.0). Required for manual runs."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend
        working-directory: todo-backend
        run: mvn -B -ntp clean package

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: todo-frontend/package-lock.json

      - name: Install frontend
        working-directory: todo-frontend
        run: npm ci --legacy-peer-deps

      - name: Test frontend
        working-directory: todo-frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: todo-frontend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v6
        with:
          name: todo-backend-jar
          path: todo-backend/target/*.jar
          if-no-files-found: error

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: todo-frontend-build
          path: todo-frontend/build
          if-no-files-found: error

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            todo-backend/target/*.jar
            todo-frontend/build/**